name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Plain-Kotlin modules (weather, calendar, model): fast, no Android needed.
      - name: Core unit tests
        run: ./gradlew :core:model:test :core:weather:test :core:calendar:test

      - name: Lint and debug APK
        run: ./gradlew :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: tessera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
