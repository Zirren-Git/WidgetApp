name: Release

# Publishing a GitHub Release (for example tag v0.1.0) builds the APK from that tag
# and attaches it to the release, with a SHA-256 checksum.
#
# Signing:
# - With a release key in the repository secrets (TESSERA_KEYSTORE_BASE64,
#   TESSERA_KEYSTORE_PASSWORD, TESSERA_KEY_ALIAS, TESSERA_KEY_PASSWORD) it builds
#   the optimized release APK, package com.zirren.tessera, signed with that key.
# - Without one it builds a debug-signed preview (package com.zirren.tessera.debug),
#   which installs next to, and never conflicts with, properly signed releases.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Core unit tests
        run: ./gradlew :core:model:test :core:weather:test :core:calendar:test

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.TESSERA_KEYSTORE_BASE64 }}
          TESSERA_KEYSTORE_PASSWORD: ${{ secrets.TESSERA_KEYSTORE_PASSWORD }}
          TESSERA_KEY_ALIAS: ${{ secrets.TESSERA_KEY_ALIAS }}
          TESSERA_KEY_PASSWORD: ${{ secrets.TESSERA_KEY_PASSWORD }}
        run: |
          VERSION="${TAG#v}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            export TESSERA_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$TESSERA_KEYSTORE_PATH"
            ./gradlew :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "tessera-$VERSION.apk"
          else
            echo "::warning::No release key in the repository secrets, so this is a debug-signed preview build."
            ./gradlew :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "tessera-$VERSION.apk"
          fi
          sha256sum tessera-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" tessera-*.apk SHA256SUMS.txt --clobber
